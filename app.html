<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宝可梦：关都篇（纯文字像素版）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       宝可梦：关都篇 - 像素风 UI
       Created by haodongsheng
       ============================================================ */
    :root {
      --bg: #171a21;
      --bg-panel: #20242e;
      --bg-elevated: #2a2f3c;
      --border: #3a4050;
      --text: #e8e6d8;
      --text-dim: #8a90a0;
      --red: #e8484f;
      --gold: #f8c84f;
      --green: #58c25c;
      --blue: #4aa8f8;
      --hp: #58c25c;
      --font: 'Press Start 2P', 'Fusion Pixel', 'Zpix', 'PingFang SC', 'Microsoft YaHei', monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    body { overflow-x: hidden; }
    .log-line.log-player { color: var(--blue); }
    .log-line.log-foe { color: var(--red); }
    .log-line.log-good { color: var(--green); }
    .log-line.log-bad { color: var(--red); }
    .log-line.log-info { color: #8fb3d9; }
    .log-line.log-warn { color: #ffd24a; font-weight: bold; text-shadow: 0 0 6px rgba(255,210,74,0.65); }
    .bag-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .bag-tabs .btn { font-size: 10px; padding: 5px 8px; }
    .bag-tabs .btn.active { background: var(--blue); color: #06121f; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.35); }
    .turn-hint { text-align: center; color: var(--gold); font-size: 10px; margin-bottom: 6px; }
    .candy-bonus { color: var(--green); }
    .candy-max { color: var(--gold); }
    #app { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; }

    .pixel-frame {
      border: 3px solid var(--border);
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.08);
      background: var(--bg-panel);
    }
    .screen { display: none !important; }
    .screen.active { display: block !important; }

    .btn {
      display: inline-block;
      border: 3px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 10px 12px;
      cursor: pointer;
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.08);
      text-align: left;
      line-height: 1.4;
    }
    .btn:active { transform: translate(1px, 1px); box-shadow: inset 3px 3px 0 rgba(0,0,0,0.35); }
    .btn[disabled] { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: #7a2a30; border-color: #a83a42; color: #ffd9d9; }
    .btn-danger { background: #4a2428; border-color: #6a3438; color: #ffb3b3; }
    .btn-sm { padding: 6px 8px; font-size: 10px; }
    .btn-big { width: 100%; padding: 14px; font-size: 13px; margin-top: 10px; text-align: center; }

    /* ---------- 标题 ---------- */
    #screen-title { padding: 48px 22px; text-align: center; }
    .title-logo { font-size: 30px; color: var(--red); letter-spacing: 2px; text-shadow: 3px 3px 0 #000; }
    .title-sub { font-size: 11px; color: var(--text-dim); margin-top: 10px; line-height: 1.8; }
    .title-badge { display: inline-block; margin-top: 16px; padding: 5px 10px; font-size: 10px; border: 3px solid var(--border); color: var(--gold); }
    .title-actions { margin-top: 28px; }
    .title-reset { margin-top: 18px; font-size: 9px; color: var(--text-dim); }
    .title-tools { margin-top: 12px; display: flex; gap: 8px; justify-content: center; }

    /* ---------- 选御三家 ---------- */
    #screen-starter { padding: 26px 18px; }
    .sec-title { font-size: 13px; color: var(--gold); margin-bottom: 16px; letter-spacing: 1px; }
    .starter-row { display: flex; gap: 10px; }
    .starter-card { flex: 1; text-align: center; padding: 12px 6px; cursor: pointer; }
    .starter-card:active { transform: translate(1px, 1px); }
    .starter-icon { display: flex; justify-content: center; margin-bottom: 8px; }
    .starter-name { font-size: 12px; }
    .starter-type { font-size: 9px; color: var(--text-dim); margin-top: 5px; }
    .starter-hint { font-size: 10px; color: var(--text-dim); line-height: 1.8; margin-top: 18px; }

    /* ---------- 主场景 ---------- */
    #screen-map { padding: 10px 10px 18px; flex-direction: column; height: 100dvh; position: relative; }
    #screen-map.active { display: flex !important; }
    /* 右上角重开按钮：远离底部操作区，避免误触 */
    .map-reset-wrap { position: absolute; top: 8px; right: 8px; z-index: 10; }
    .map-reset-wrap .btn { padding: 6px 9px; font-size: 9px; opacity: 0.9; }
    .scene-top { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 8px; flex-wrap: wrap; gap: 4px; padding-right: 74px; }
    .meta-line { font-size: 10px; color: var(--gold); margin-bottom: 8px; }
    .goal-line { font-size: 10px; color: var(--blue); margin-bottom: 6px; }
    .log-box {
      flex: 1;
      min-height: 120px;
      max-height: 42vh;
      overflow-y: auto;
      padding: 10px;
      font-size: 12px;
      line-height: 1.8;
      background: var(--bg-panel);
      border: 3px solid var(--border);
      box-shadow: inset 3px 3px 0 rgba(0,0,0,0.35);
    }
    .log-box.small { flex: 0 0 auto; height: 120px; }
    #party-strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
    .party-card { flex: 0 0 auto; width: 112px; padding: 6px; cursor: pointer; }
    .party-card:hover { border-color: #5a6a80; }
    .party-icon { display: flex; justify-content: center; }
    .party-info { font-size: 10px; }
    .party-name { font-size: 10px; white-space: nowrap; overflow: hidden; }
    .party-lv { color: var(--text-dim); font-size: 9px; margin: 2px 0; }
    .party-empty { color: var(--text-dim); font-size: 11px; padding: 10px; }

    .hpbar { height: 8px; background: #10131a; border: 2px solid var(--border); }
    .hpbar-fill { height: 100%; transition: width 0.45s linear; }
    .hp-text { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
    .party-pp { font-size: 9px; color: var(--text-dim); margin-top: 2px; }
    .status-badge { font-size: 10px; }

    #action-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .travel-btn, .learn-btn, .modal-btns .btn { width: 100%; margin-top: 6px; }
    .btn[disabled].travel-btn { opacity: 0.45; }
    /* 弹窗正文里的独立按钮统一等宽，避免随文字长度大小不一 */
    #modal-root .modal-body > .btn { width: 100%; display: block; text-align: left; }
    /* 招式状态标签：已学会（绿块）/ 要学习（金块），实心色块避免基线错位 */
    .tag-known, .tag-learn { display: inline-block; font-size: 8px; padding: 2px 5px; margin-right: 6px; line-height: 1.2; vertical-align: middle; flex: 0 0 auto; }
    .tag-known { color: #10241a; background: var(--green); }
    .tag-learn { color: #241b06; background: var(--gold); }
    .mv-name { color: var(--mv-tc, var(--text)); }
    /* 学招弹窗：新招信息卡 */
    .learn-new { border: 3px solid var(--gold); background: #26200f; padding: 8px; margin-bottom: 8px; }
    .learn-new-tag { font-size: 9px; color: var(--gold); margin-bottom: 3px; }
    .learn-new-name { font-size: 15px; color: var(--tc, var(--gold)); margin: 2px 0; }
    .learn-new-meta { font-size: 9px; color: var(--text-dim); line-height: 1.7; }
    /* 学招弹窗旧招按钮：flex 两行对齐（标签+招名 / 效果说明） */
    .learn-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; }
    .learn-btn-line { display: flex; align-items: center; width: 100%; }
    .learn-old-meta { display: block; font-size: 8px; color: var(--text-dim); margin-top: 2px; line-height: 1.5; }
    /* 更换招式槽位按钮：flex 横向对齐（标签+编号+招名） */
    .slot-btn { display: flex; align-items: center; width: 100%; text-align: left; }
    .slot-no { color: var(--text-dim); min-width: 24px; flex: 0 0 auto; }

    /* ---------- 战斗 ---------- */
    #screen-battle { padding: 10px 10px 18px; flex-direction: column; height: 100dvh; }
    #screen-battle.active { display: flex !important; }
    .battle-card { display: flex; gap: 10px; padding: 10px; margin-bottom: 8px; }
    .battle-card.hit { animation: hitFlash 0.4s ease; }
    @keyframes hitFlash {
      0% { transform: translateX(0); }
      30% { transform: translateX(-6px); background: rgba(232,72,79,0.28); }
      60% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
    .battle-icon { display: flex; align-items: center; }
    .battle-info { flex: 1; }
    .battle-name { font-size: 13px; }
    .battle-lv { font-size: 10px; color: var(--text-dim); margin: 4px 0; }
    .vs-divider { text-align: center; color: var(--red); font-size: 11px; margin: 2px 0; }
    #battle-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .move-btn { position: relative; width: 100%; display: block; text-align: left; }
    .move-type { display: block; font-size: 9px; color: var(--tc); margin-top: 3px; }
    .move-eff { display: block; font-size: 9px; margin-top: 2px; }
    .move-pp { display: block; font-size: 9px; color: var(--text-dim); margin-top: 2px; }
    .move-eff.super { color: var(--green); }
    .move-eff.weak { color: #e8a33d; }
    .move-eff.no { color: var(--text-dim); }
    .move-effect { display: block; font-size: 8px; color: #9fb8d8; margin-top: 2px; line-height: 1.5; }

    /* ---------- 弹窗 ---------- */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center; z-index: 50; padding: 18px;
    }
    .modal { width: 100%; max-width: 440px; max-height: 78vh; overflow-y: auto; padding: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--gold); margin-bottom: 10px; }
    .modal-body { font-size: 11px; }
    .map-wrap { position: relative; width: 100%; height: 700px; overflow: hidden; border: 3px solid var(--border); background: #10141b; }
    .map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-lines line { stroke: #3a4050; stroke-width: 0.7; }
    .map-node { position: absolute; transform: translate(-50%, -50%); border: 2px solid var(--border); background: #232833; color: var(--text-dim); font-size: 8px; padding: 1px 3px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; cursor: pointer; min-width: 38px; }
    .map-node span { white-space: nowrap; }
    .map-node.visited { background: #2f3a4d; color: var(--text); }
    .map-node.current { background: var(--blue); color: #06121f; border-color: #7cc4ff; box-shadow: 0 0 8px rgba(74,168,248,0.7); }
    .map-node.next { border-color: var(--gold); animation: mapPulse 1.2s ease-in-out infinite; }
    .map-node.locked { opacity: 0.4; }
    @keyframes mapPulse { 0%,100% { box-shadow: 0 0 0 rgba(248,200,79,0); } 50% { box-shadow: 0 0 8px rgba(248,200,79,0.7); } }
    .map-legend { font-size: 9px; color: var(--text-dim); margin-top: 6px; text-align: center; }
    .shop-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--border); }
    .shop-row.locked { opacity: 0.45; }
    .shop-lock { font-size: 9px; color: var(--text-dim); }
    .shop-desc { font-size: 9px; color: var(--text-dim); padding: 3px 0 8px; }
    .shop-qty { display: flex; align-items: center; gap: 4px; margin-top: 5px; }
    .shop-qty b { min-width: 20px; text-align: center; color: var(--gold); }
    .shop-hint { font-size: 10px; color: var(--text-dim); line-height: 1.8; margin: 6px 0; }
    .save-code { width: 100%; min-height: 90px; resize: vertical; background: #10131a; color: var(--text); border: 3px solid var(--border); font-family: var(--font); font-size: 10px; padding: 8px; }
    .party-row { display: flex; gap: 8px; align-items: center; padding: 8px; margin-bottom: 8px; }
    .lead-tag { font-size: 10px; color: var(--gold); border: 2px solid var(--gold); padding: 3px 7px; }
    .rarity { font-size: 9px; margin-right: 4px; white-space: nowrap; }
    .rarity.r-legendary { color: var(--gold); text-shadow: 0 0 6px rgba(248,200,79,0.55); }
    .rarity.r-rare { color: #d68cff; }
    .rarity.r-uncommon { color: var(--blue); }
    .dex-rarity { font-size: 8px; line-height: 1.6; }
    .dex-rarity.r-legendary { color: var(--gold); }
    .dex-rarity.r-rare { color: #d68cff; }
    .dex-rarity.r-uncommon { color: var(--blue); }
    .itemdex-cat { color: var(--gold); font-size: 10px; margin: 10px 0 4px; border-bottom: 2px dashed var(--border); padding-bottom: 3px; }
    .move-dex-search { width: 100%; background: #10131a; color: var(--text); border: 3px solid var(--border); font-family: var(--font); font-size: 10px; padding: 8px; margin-bottom: 6px; }
    .modal-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .row-btns { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
    .detail-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .detail-icon { display: flex; align-items: center; }
    .detail-name { font-size: 13px; }
    .detail-no { font-size: 10px; color: var(--text-dim); }
    .detail-lv { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
    .detail-row { display: flex; justify-content: space-between; font-size: 10px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
    .dex-hint { font-size: 10px; color: var(--text-dim); margin-bottom: 8px; }
    .dex-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .dex-cell { text-align: center; padding: 6px 2px; border: 2px solid var(--border); background: var(--bg-elevated); cursor: pointer; }
    .dex-cell:hover { border-color: #5a6a80; }
    .dex-unknown { font-size: 24px; color: var(--text-dim); }
    .dex-cell.caught { border-color: var(--gold); }
    .dex-cell.seen { border-color: var(--blue); }
    .dex-icon { display: flex; justify-content: center; align-items: center; min-height: 30px; color: var(--text-dim); }
    .dex-name { font-size: 9px; margin-top: 3px; white-space: nowrap; overflow: hidden; }
    .dex-no { font-size: 8px; color: var(--text-dim); }

    /* CRT 扫描线 */
    .scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 60;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px);
      opacity: 0.28;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 标题 -->
    <div id="screen-title" class="screen">
      <div class="title-logo">POKéMON</div>
      <div class="title-sub">关都篇 · 纯文字像素版<br>151 只宝可梦的冒险，从这里开始</div>
      <div class="title-badge">KANTO REGION</div>
      <div class="title-actions">
        <button class="btn btn-primary btn-big" onclick="uiStartNew()">✦ 新的冒险</button>
        <button class="btn btn-big" onclick="uiContinue()" id="btn-continue">继续冒险</button>
      </div>
      <div class="title-tools">
        <button class="btn btn-sm" onclick="exportSave()">📤 导出存档</button>
        <button class="btn btn-sm" onclick="showImportSave()">📥 导入存档</button>
      </div>
      <div class="title-reset"><button class="btn btn-sm btn-danger" onclick="uiReset()">删除存档</button></div>
    </div>

    <!-- 选御三家 -->
    <div id="screen-starter" class="screen">
      <div class="sec-title">—— 选择你的伙伴 ——</div>
      <div id="starter-content"></div>
    </div>

    <!-- 主界面 -->
    <div id="screen-map" class="screen">
      <div class="map-reset-wrap"><button class="btn btn-sm btn-danger" onclick="doMapAction('reset')">🗑️ 重开</button></div>
      <div class="scene-top">
        <span id="loc-label"></span>
        <span id="weather-label"></span>
      </div>
      <div class="meta-line" id="meta-label"></div>
      <div class="goal-line" id="goal-label"></div>
      <div id="log-box" class="log-box"></div>
      <div id="party-strip"></div>
      <div id="action-panel"></div>
    </div>

    <!-- 战斗界面 -->
    <div id="screen-battle" class="screen">
      <div id="battle-foe"></div>
      <div class="vs-divider">▼ 对战 ▼</div>
      <div id="battle-player"></div>
      <div id="battle-log" class="log-box small"></div>
      <div id="battle-actions"></div>
    </div>
  </div>

  <div class="scanlines" aria-hidden="true"></div>
  <div id="modal-root"></div>

  <script src="./js/data/typechart.js"></script>
  <script src="./js/data/moves.js"></script>
  <script src="./js/data/moves_gen.js"></script>
  <script src="./js/data/pokedex.js"></script>
  <script src="./js/data/pokedex_gen.js"></script>
  <script src="./js/data/maps.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/ui.js"></script>
</body>
</html>
